  <ellipse cx="60" cy="52" rx="24" ry="27" fill="url(#r-skin)"/>
  <!-- 머리카락: 앞머리 내린 풍성한 스타일 -->
  <path d="M34 52 C30 30 44 18 60 18 C78 18 90 30 86 52 C84 44 80 39 74 37 C72 42 66 45 59 43 C56 46 50 48 45 46 C41 47 37 49 34 52 Z" fill="url(#r-hair)"/>
  <path d="M46 25 C52 21 62 21 68 24" fill="none" stroke="#8c6f80" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
  <!-- 눈썹·눈 -->
  <path d="M46 47 Q51 45 55 47 M65 47 Q69 45 74 47" fill="none" stroke="#3a2a35" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="51" cy="56" rx="2.8" ry="3.4" fill="#2a1f28"/><ellipse cx="69" cy="56" rx="2.8" ry="3.4" fill="#2a1f28"/>
  <circle cx="52" cy="54.8" r="1" fill="#fff"/><circle cx="70" cy="54.8" r="1" fill="#fff"/>

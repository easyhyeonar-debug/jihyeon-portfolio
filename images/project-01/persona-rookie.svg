  <ellipse cx="45" cy="63" rx="4.5" ry="2.6" fill="#ff8f8f" opacity=".35"/><ellipse cx="75" cy="63" rx="4.5" ry="2.6" fill="#ff8f8f" opacity=".35"/>
  <path d="M53 65 Q60 72 67 65" fill="#fff" stroke="#a8504a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="신인 배우 캐릭터">
  <defs>
    <radialGradient id="r-skin" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe6d6"/><stop offset=".6" stop-color="#f6c3a6"/><stop offset="1" stop-color="#e09a7b"/>
    </radialGradient>
    <linearGradient id="r-neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d98f72"/><stop offset="1" stop-color="#eeb193"/>
    </linearGradient>
    <radialGradient id="r-hood" cx="35%" cy="20%" r="90%">
      <stop offset="0" stop-color="#d9c9ff"/><stop offset=".5" stop-color="#9f7bff"/><stop offset="1" stop-color="#6a3fe0"/>
    </radialGradient>
    <radialGradient id="r-hair" cx="40%" cy="25%" r="80%">
      <stop offset="0" stop-color="#6a5060"/><stop offset=".55" stop-color="#3a2a35"/><stop offset="1" stop-color="#1f161d"/>
    </radialGradient>
    <radialGradient id="r-shine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 몸(후드티) -->
  <path d="M12 120 C12 95 32 82 60 82 C88 82 108 95 108 120 Z" fill="url(#r-hood)"/>
  <path d="M40 84 C46 96 74 96 80 84 C74 90 46 90 40 84 Z" fill="#5a32c8" opacity=".55"/>
